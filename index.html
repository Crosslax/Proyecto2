<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Fanpage de Käärijä: Inicio" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <title>Mundo Käärijä</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <div class="container-fluid text-center p-0">
      <header>
        <h1>Mundo Käärijä</h1>
      </header>

      <div class="wrapper">
        <nav>
          <ul class="navbar-nav">
            <li class="nav-item">
              <a href="#" aria-current="page" class="nav-link active">Inicio</a>
            </li>
            <li class="nav-item">
              <a href="musica.html" class="nav-link">Música</a>
            </li>
            <li class="nav-item">
              <a href="tour.html" class="nav-link">Tour</a>
            </li>
          </ul>
        </nav>

        <main>
          <div class="main-container">
            <section class="hero-section mb-5">
              <div class="hero-content">
                <h2>CHA CHA CHA</h2>
                <p class="lead">
                  Bienvenido al epicentro del caos verde. La fanpage oficial en
                  español de Käärijä.
                </p>
              </div>
            </section>

            <div class="row mt-4">
              <div class="col-md-6">
                <div class="card bg-dark text-white border-neon">
                  <div class="card-body">
                    <h3 class="card-title h5">Último Lanzamiento</h3>
                    <p class="card-text">
                      ¡No te pierdas "Ruoska"! Ya disponible en todas las
                      plataformas.
                    </p>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="card bg-dark text-white border-neon">
                  <div class="card-body">
                    <h3 class="card-title h5">Próxima Parada</h3>
                    <p class="card-text">Praga - ¡Entradas agotadas!</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>

      <footer class="pb-5 d-flex justify-content-center">
        <button
          id="theme-toggle"
          aria-label="Cambiar entre modo claro y oscuro"
        >
          Alternar Modo
        </button>
      </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      const btn = document.getElementById("theme-toggle");
      const currentTheme = localStorage.getItem("theme");

      if (currentTheme === "light") {
        document.body.classList.add("light-mode");
      }

      btn.addEventListener("click", () => {
        document.body.classList.toggle("light-mode");

        let theme = "dark";
        if (document.body.classList.contains("light-mode")) {
          theme = "light";
        }
        localStorage.setItem("theme", theme);
      });
    </script>
  </body>
</html>
